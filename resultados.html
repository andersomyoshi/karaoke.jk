<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - Karaokê</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bungee+Outline&family=Changa+One:ital@0;1&display=swap');
        :root {
            --background-image: url('https://static.vecteezy.com/system/resources/previews/029/561/970/non_2x/music-karaoke-party-vivid-background-free-photo.jpg'); 
            --karaoke-pink: #ff1493;
            --karaoke-blue: #00ffff;
        }
        body {
            background: #1f0d1f var(--background-image) fixed center/cover;
            color: white;
            font-family: 'Changa One', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .ranking-card {
            backdrop-filter: blur(10px) brightness(80%);
            background-color: rgba(31, 13, 31, 0.85);
            border: 3px solid var(--karaoke-blue);
            box-shadow: 0 0 15px var(--karaoke-pink);
        }
        .winner {
            background: linear-gradient(45deg, var(--karaoke-pink), var(--karaoke-blue));
            box-shadow: 0 0 20px gold;
            color: black;
        }
    </style>
</head>
<body class="p-8">
    <h1 class="text-5xl text-center mb-8 font-bold" style="font-family:'Bungee Outline'">RANKING GERAL</h1>
    
    <div class="ranking-card w-full max-w-2xl p-6 rounded-2xl">
        <div id="ranking-list" class="space-y-4">
            <p class="text-center">Carregando votos...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const FALLBACK_CONFIG = {
            apiKey: "AIzaSyAuQ9XNsGVIp7Y0FRftnbNhDL9lGl8hNTI",
            authDomain: "karaoke-38a94.firebaseapp.com",
            projectId: "karaoke-38a94", 
            storageBucket: "karaoke-38a94.firebasestorage.app",
            messagingSenderId: "17039001114",
            appId: "1:17039001114:web:5a382081f045d4f84273a3"
        };

        const app = initializeApp(FALLBACK_CONFIG);
        const db = getFirestore(app);
        const list = document.getElementById('ranking-list');

        onSnapshot(query(collection(db, `/artifacts/${appId}/public/data/candidates`)), (snap) => {
            let candidates = [];
            let totalVotos = 0;

            snap.forEach(d => {
                const data = d.data();
                const v = data.voteCount || 0;
                totalVotos += v;
                candidates.push({ name: data.name, votes: v });
            });

            candidates.sort((a, b) => b.votes - a.votes);
            list.innerHTML = '';

            candidates.forEach((c, i) => {
                const perc = totalVotos > 0 ? ((c.votes / totalVotos) * 100).toFixed(1) : 0;
                const div = document.createElement('div');
                div.className = `p-4 rounded-xl flex justify-between items-center ${i === 0 && c.votes > 0 ? 'winner' : 'bg-gray-800'}`;
                div.innerHTML = `
                    <span class="text-xl font-bold">${i+1}º ${c.name}</span>
                    <span class="text-2xl font-black">${perc}%</span>
                `;
                list.appendChild(div);
            });
        });
    </script>
</body>
</html>
