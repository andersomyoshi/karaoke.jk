<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - Karaokê</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bungee+Outline&family=Changa+One:ital@0;1&display=swap');
        :root {
            --background-image: url('https://static.vecteezy.com/system/resources/previews/029/561/970/non_2x/music-karaoke-party-vivid-background-free-photo.jpg'); 
            --karaoke-pink: #ff1493;
            --karaoke-blue: #00ffff;
        }
        body {
            background-color: #1f0d1f;
            background-image: var(--background-image);
            background-size: cover;
            background-attachment: fixed;
            color: white;
            font-family: 'Changa One', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .ranking-card {
            backdrop-filter: blur(12px) brightness(80%);
            background-color: rgba(31, 13, 31, 0.85);
            border: 3px solid var(--karaoke-blue);
            box-shadow: 0 0 20px var(--karaoke-pink);
        }
        .winner-row {
            background: linear-gradient(90deg, rgba(255,20,147,0.8), rgba(0,255,255,0.8));
            color: white;
            border: 2px solid gold;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 5px gold; }
            50% { box-shadow: 0 0 20px gold; }
            100% { box-shadow: 0 0 5px gold; }
        }
    </style>
</head>
<body class="p-4 sm:p-8">
    <h1 class="text-4xl sm:text-6xl text-center mb-10 font-bold" style="font-family:'Bungee Outline'; text-shadow: 2px 2px 10px var(--karaoke-pink)">
        RANKING DE VOTOS
    </h1>
    
    <div class="ranking-card w-full max-w-2xl p-6 rounded-2xl shadow-2xl">
        <div id="ranking-list" class="space-y-4">
            <div class="text-center py-10">
                <div class="animate-spin inline-block w-8 h-8 border-4 border-t-transparent border-karaoke-blue rounded-full mb-4"></div>
                <p class="text-xl">Carregando resultados...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuração do seu Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAuQ9XNsGVIp7Y0FRftnbNhDL9lGl8hNTI",
            authDomain: "karaoke-38a94.firebaseapp.com",
            projectId: "karaoke-38a94", 
            storageBucket: "karaoke-38a94.firebasestorage.app",
            messagingSenderId: "17039001114",
            appId: "1:17039001114:web:5a382081f045d4f84273a3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        // Definição fixa do caminho para evitar erro de 'undefined'
        const CANDIDATES_PATH = "/artifacts/default-app-id/public/data/candidates";

        async function start() {
            try {
                await signInAnonymously(auth);
                listenRanking();
            } catch (err) {
                document.getElementById('ranking-list').innerHTML = `<p class="text-red-500 text-center">Erro de conexão: ${err.message}</p>`;
            }
        }

        function listenRanking() {
            const listDiv = document.getElementById('ranking-list');
            
            onSnapshot(collection(db, CANDIDATES_PATH), (snapshot) => {
                let candidates = [];
                let totalVotosGeral = 0;

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const v = data.voteCount || 0;
                    totalVotosGeral += v;
                    candidates.push({ name: data.name, votes: v });
                });

                // Ordenar do maior para o menor
                candidates.sort((a, b) => b.votes - a.votes);

                if (candidates.length === 0) {
                    listDiv.innerHTML = '<p class="text-center">Nenhum candidato cadastrado.</p>';
                    return;
                }

                listDiv.innerHTML = '';
                candidates.forEach((c, index) => {
                    const porcentagem = totalVotosGeral > 0 ? ((c.votes / totalVotosGeral) * 100).toFixed(1) : 0;
                    const isFirst = index === 0 && c.votes > 0;

                    const row = document.createElement('div');
                    row.className = `flex justify-between items-center p-4 rounded-xl transition-all ${isFirst ? 'winner-row scale-105' : 'bg-gray-800/50 border border-gray-700'}`;
                    
                    row.innerHTML = `
                        <div class="flex items-center gap-4">
                            <span class="text-2xl font-black">${index + 1}º</span>
                            <span class="text-xl font-bold uppercase">${c.name}</span>
                        </div>
                        <div class="text-right">
                            <span class="block text-2xl font-black ${isFirst ? 'text-white' : 'text-karaoke-blue'}">${porcentagem}%</span>
                            <span class="text-xs opacity-70">${c.votes} votos</span>
                        </div>
                    `;
                    listDiv.appendChild(row);
                });
            });
        }

        start();
    </script>
</body>
</html>
