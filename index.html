<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votação Karaokê - Escolha seu Favorito!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bungee+Outline&family=Changa+One:ital@0;1&display=swap');
        :root {
            --logo-text: "Noite de Estrelas";
            --background-image: url('https://static.vecteezy.com/system/resources/previews/029/561/970/non_2x/music-karaoke-party-vivid-background-free-photo.jpg'); 
            --karaoke-pink: #ff1493;
            --karaoke-blue: #00ffff;
        }
        body {
            background-color: #0d131f;
            background-image: var(--background-image);
            background-size: cover;
            background-attachment: fixed;
            color: white;
            font-family: 'Changa One', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .vote-card {
            backdrop-filter: blur(10px) brightness(80%);
            background-color: rgba(13, 19, 31, 0.85);
            border: 3px solid var(--karaoke-pink);
            box-shadow: 0 0 20px var(--karaoke-blue), 0 0 40px var(--karaoke-pink) inset;
        }
        .karaoke-title {
            font-family: 'Bungee Outline', cursive;
            text-shadow: 0 0 5px var(--karaoke-blue), 0 0 10px var(--karaoke-pink);
        }
        /* Efeito Neon para Seleção */
        .candidate-item {
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .candidate-item.selected {
            border-color: var(--karaoke-blue);
            background-color: rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 15px var(--karaoke-blue), 0 0 10px var(--karaoke-pink) inset;
            transform: scale(1.05);
        }
        .candidate-item.selected h3 {
            text-shadow: 0 0 8px var(--karaoke-blue);
            color: white;
        }
    </style>
</head>
<body class="p-4">
    <div class="vote-card max-w-4xl w-full p-8 rounded-2xl mt-8 mb-8">
        <h1 class="karaoke-title text-4xl sm:text-5xl text-center mb-8">VOTAÇÃO KARAOKÊ</h1>
        
        <div id="voting-area">
            <div class="mb-6 bg-gray-700 p-4 rounded-lg">
                <label for="voter-nickname" class="block text-xl font-bold mb-2 text-yellow-300">Seu Nome ou Apelido:</label>
                <input type="text" id="voter-nickname" placeholder="Digite seu nome" class="w-full p-3 rounded text-black bg-white focus:outline-none" maxlength="20">
            </div>

            <p class="text-center mb-6 text-xl text-yellow-300">Selecione o cantor para dar seu voto!</p>
            
            <div id="candidates-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                </div>

            <div class="text-center mt-8">
                <p id="status-message" class="hidden mb-4"></p>
                <button id="submit-vote-btn" disabled class="bg-gray-500 text-white font-bold py-3 px-8 rounded-lg text-lg transition duration-300 opacity-50">
                    Confirmar Voto
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc, query, where, getDocs, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const FALLBACK_CONFIG = {
            apiKey: "AIzaSyAuQ9XNsGVIp7Y0FRftnbNhDL9lGl8hNTI",
            authDomain: "karaoke-38a94.firebaseapp.com",
            projectId: "karaoke-38a94", 
            storageBucket: "karaoke-38a94.firebasestorage.app",
            messagingSenderId: "17039001114",
            appId: "1:17039001114:web:5a382081f045d4f84273a3"
        };
        
        const app = initializeApp(FALLBACK_CONFIG);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const CANDIDATES_PATH = `/artifacts/${appId}/public/data/candidates`;
        const VOTES_PATH = `/artifacts/${appId}/public/data/votes`;

        let selectedCandidateId = null;

        async function init() {
            await signInAnonymously(auth);
            loadCandidates();
        }

        function loadCandidates() {
            const list = document.getElementById('candidates-list');
            onSnapshot(query(collection(db, CANDIDATES_PATH)), (snap) => {
                list.innerHTML = '';
                snap.forEach(docSnap => {
                    const c = docSnap.data();
                    if (c.isVotingEnabled !== false) {
                        const div = document.createElement('div');
                        div.className = 'candidate-item bg-gray-800 p-6 rounded-xl cursor-pointer text-center';
                        div.innerHTML = `<h3 class="text-2xl font-bold text-karaoke-blue">${c.name}</h3>`;
                        div.onclick = () => selectCandidate(docSnap.id, div);
                        list.appendChild(div);
                    }
                });
            });
        }

        function selectCandidate(id, element) {
            document.querySelectorAll('.candidate-item').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedCandidateId = id;
            const btn = document.getElementById('submit-vote-btn');
            btn.disabled = false;
            btn.classList.replace('bg-gray-500', 'bg-green-600');
            btn.classList.remove('opacity-50');
        }

        document.getElementById('submit-vote-btn').onclick = async () => {
            const nick = document.getElementById('voter-nickname').value.trim();
            const status = document.getElementById('status-message');
            
            if(!nick) {
                alert("Por favor, digite seu apelido!");
                return;
            }

            try {
                // Checa se já votou nesse candidato com esse apelido
                const q = query(collection(db, VOTES_PATH), 
                    where("candidateId", "==", selectedCandidateId), 
                    where("voterNickname", "==", nick));
                const existing = await getDocs(q);

                if(!existing.empty) {
                    status.textContent = "Você já votou neste cantor!";
                    status.className = "text-red-400 block mb-4";
                    return;
                }

                await addDoc(collection(db, VOTES_PATH), {
                    candidateId: selectedCandidateId,
                    voterNickname: nick,
                    timestamp: new Date().toISOString()
                });

                // Incrementa contador
                const ref = doc(db, CANDIDATES_PATH, selectedCandidateId);
                await runTransaction(db, async (t) => {
                    const snap = await t.get(ref);
                    const newVotes = (snap.data().voteCount || 0) + 1;
                    t.update(ref, { voteCount: newVotes });
                });

                window.location.href = 'resultados.html';
            } catch (e) {
                console.error(e);
            }
        };

        init();
    </script>
</body>
</html>
